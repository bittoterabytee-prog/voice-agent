services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: voice
      POSTGRES_PASSWORD: voice
      POSTGRES_DB: voice_agent
    ports:
      - "5432:5432"
    volumes:
      - voice_agent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice -d voice_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  voice_agent_pgdata:
